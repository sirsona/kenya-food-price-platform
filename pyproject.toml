[project]
name = "kenya-food-price-platform"
version = "0.1.0"
description = "Kenya food price and inflation data platform"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=16.0",
    "requests>=2.32",
    "PyYAML>=6.0",
    "SQLAlchemy>=1.4",
    "psycopg[binary]>=3.2",
    "shapely>=2.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
